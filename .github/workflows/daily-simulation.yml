name: Daily Supabase simulation

on:
  schedule:
    # 01:00 UTC every day; adjust for the preferred Swedish business-day start.
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: daily-supabase-simulation
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Reset and run daily scenario
        run: python -m scripts.run_daily --orders 30 --steps 8
